<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore as peças Nexus Store por categoria." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=3" />
    <link rel="stylesheet" href="category.css" />
    <link rel="stylesheet" href="shop-header.css" />
    <title>Nexus Store | Categorias</title>
  </head>
  <body class="category-page">
    <header class="topbar category-topbar">
      <a class="brand-wrap category-brand" href="index.html" aria-label="Nexus Store, início">
        <span class="brand-mark">N</span>
        <span><span class="brand-kicker">streetwear store</span><strong>NEXUS</strong></span>
      </a>
      <a class="category-return" href="index.html#colecao">← Voltar para a loja</a>
      <div class="store-header-actions">
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Ativar tema escuro">☾</button>
        <button type="button" class="favorites-toggle" id="favoritesToggle" aria-label="Abrir favoritos" aria-expanded="false">
          <span aria-hidden="true">♡</span><strong id="favoritesCount">0</strong>
        </button>
        <button type="button" class="cart-pill" id="cartToggle" aria-label="Abrir carrinho" aria-expanded="false">
          <span class="bag-icon" aria-hidden="true"></span><strong id="cartCount">0</strong>
        </button>
        <a class="store-account-link" href="conta.html" aria-label="Minha conta">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4.5 21a7.5 7.5 0 0 1 15 0" /></svg>
        </a>
      </div>
    </header>
    <main class="category-main">
      <nav class="category-breadcrumb" aria-label="Navegação estrutural"><a href="index.html">Início</a><span>/</span><span>Categorias</span></nav>
      <div class="category-heading">
        <div><span class="section-label">NEXUS / PEÇAS</span><h1 id="categoryTitle">Coleção</h1></div>
        <p id="categoryCount" aria-live="polite"></p>
      </div>
      <nav class="category-tabs" id="categoryTabs" aria-label="Filtrar por categoria"></nav>
      <section class="category-products" aria-label="Produtos desta categoria">
        <div class="product-grid" id="categoryProducts"></div>
        <div class="category-empty" id="categoryEmpty" hidden>
          <h2>Essa categoria está chegando.</h2>
          <p>Ainda não há produtos cadastrados aqui.</p>
          <a href="index.html#colecao">Ver todas as peças</a>
        </div>
      </section>
    </main>
    <footer class="category-footer"><a href="index.html">NEXUS</a><span>Vista sua presença.</span></footer>
    <script src="products.js?v=3"></script>
    <script src="category.js?v=2"></script>
    <script src="shop-header.js?v=1"></script>
    <script src="store-config.js?v=1"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="account.js?v=1"></script>
  </body>
</html>
